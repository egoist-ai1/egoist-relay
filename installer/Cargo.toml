[package]
name = "sennit-setup"
version = "1.7.1"
edition = "2021"
description = "Sennit by Egoist: фирменный установщик (оболочка вокруг NSIS-установщика Tauri)"
license = "GPL-3.0-only"
publish = false

# Отдельный крейт: не часть workspace tauri/, свой target.
[workspace]

[[bin]]
name = "Sennit-Setup"
path = "src/main.rs"

[dependencies]
sha2 = "0.10.9"
serde_json = "1.0.151"
tao = { version = "=0.37.1", default-features = false, features = ["rwh_06"] }
wry = { version = "=0.57.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-winres = "0.3.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
