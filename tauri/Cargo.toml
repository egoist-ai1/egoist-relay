 [package]
name = "egoist_relay"
version = "1.4.6"
description = "Egoist Relay"
authors = ["Alexander Zinchuk"]
license = "GPLv3"
repository = "https://github.com/Ajaxy/telegram-tt"
edition = "2024"
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "=2.12.0", features = [ "devtools", "config-json5", "tray-icon", "image-png", "unstable"] }
tauri-plugin-shell = "=2.3.5"
tauri-plugin-log = "=2.9.0"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-fs = "=2.5.1"
tauri-plugin-deep-link = "=2.4.9"
log = "0.4.33"
uuid = { version = "1.24.0", features = ["v4"] }
url = "2.5.8"
image      = "0.25.10"
imageproc  = "0.27.0"
ab_glyph   = "0.2.32"
tauri-plugin-os = "=2.3.2"
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[patch.crates-io]
tauri = { path = "vendor/tauri" }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
