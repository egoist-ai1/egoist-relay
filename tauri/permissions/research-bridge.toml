[[permission]]
identifier = "relay-research-main"
description = "Register and reply to addressed research requests in the local main Relay renderer."
commands.allow = ["relay_research_ready", "relay_research_reply"]

[[permission]]
identifier = "relay-research-social"
description = "Reply only from fixed owned research WebViews; native nonce/origin/scope validation remains mandatory."
commands.allow = ["relay_research_social_reply"]

[[permission]]
identifier = "relay-research-media"
description = "Deliver raw media bytes from the bundled main renderer to the owned native spool; nonce, request, ordering, size and disk checks stay native."
commands.allow = ["relay_research_media_chunk"]
